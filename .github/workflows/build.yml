name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # an old LTS on purpose: the AppImage and the tarball need at least the glibc of the machine that built them
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # (git describe names the version)

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake curl file \
            libsdl2-dev libglew-dev libfreetype-dev libopenal-dev

      - name: Build every program
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Package
        run: |
          ALLOW_DOWNLOAD=1 scripts/package_appimage.sh
          scripts/package_tarball.sh
          ls -l dist

      - name: Smoke test the AppImage (every bundled library must load; there is no game folder here, so it must say so)
        run: |
          out="$(env -u DISPLAY APPIMAGE_EXTRACT_AND_RUN=1 ./dist/vanburen-*-x86_64.AppImage 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "tech demo folder not found"

      - uses: actions/upload-artifact@v4
        with:
          name: vanburen-linux-x86_64
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vanburen-linux-x86_64
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Prebuilt x86_64 Linux builds. Neither contains any game data: put the AppImage (or the binary) next to the Fallout 3 Van Buren tech demo's F3.exe. See the README."
